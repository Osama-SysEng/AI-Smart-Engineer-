version: '3.8'

services:
  # Frontend
  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
      - NEXT_PUBLIC_WS_URL=ws://localhost:8000
    depends_on:
      - api
    networks:
      - ai-engineer-network

  # API Gateway
  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
      - SECRET_KEY=${SECRET_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - SAP_HOST=${SAP_HOST}
      - STORAGE_TYPE=${STORAGE_TYPE}
      - STORAGE_PATH=/app/storage
    volumes:
      - ./storage:/app/storage
    depends_on:
      - postgres
      - redis
      - ollama
    networks:
      - ai-engineer-network
    command: uvicorn src.main:app --host 0.0.0.0 --port 8000

  # Workers
  worker:
    build:
      context: ./apps/api
      dockerfile: Dockerfile.worker
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
    depends_on:
      - postgres
      - redis
    networks:
      - ai-engineer-network
    command: celery -A src.queue.celery_app worker --loglevel=info -Q default,ocr,extraction,ai,sap,reports

  # Scheduler
  scheduler:
    build:
      context: ./apps/api
      dockerfile: Dockerfile.worker
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
    depends_on:
      - postgres
      - redis
    networks:
      - ai-engineer-network
    command: celery -A src.queue.celery_app beat --loglevel=info

  # Database
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - ai-engineer-network

  # Redis
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - ai-engineer-network

  # Ollama (Local AI)
  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - ai-engineer-network
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # MinIO (Object Storage)
  minio:
    image: minio/minio:latest
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:-change-this-minio-password}
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    networks:
      - ai-engineer-network

  # Qdrant (Vector DB)
  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - ai-engineer-network

  # Adminer
  adminer:
    image: adminer:latest
    ports:
      - "8080:8080"
    networks:
      - ai-engineer-network

  # Flower (Celery Monitor)
  flower:
    build:
      context: ./apps/api
      dockerfile: Dockerfile.worker
    ports:
      - "5555:5555"
    environment:
      - REDIS_URL=${REDIS_URL}
    depends_on:
      - redis
    networks:
      - ai-engineer-network
    command: celery -A src.queue.celery_app flower --port=5555

volumes:
  postgres_data:
  redis_data:
  ollama_data:
  minio_data:
  qdrant_data:

networks:
  ai-engineer-network:
    driver: bridge
